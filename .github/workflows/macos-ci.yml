name: macOS Build and Core Tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Swift tests and native app build
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Install developer-only Xcode project generator
        run: brew install xcodegen
      - name: Build and run SorrelgateCore tests
        run: swift test --parallel
      - name: Record actual Vision OCR and mixed-PDF benchmark measurements
        run: |
          test -s "$RUNNER_TEMP/sorrelgate-m1-ocr.txt"
          test -s "$RUNNER_TEMP/sorrelgate-m1-batch.txt"
          cat "$RUNNER_TEMP/sorrelgate-m1-ocr.txt"
          cat "$RUNNER_TEMP/sorrelgate-m1-batch.txt"
          test -s "$RUNNER_TEMP/sorrelgate-m1-degraded.txt"
          cat "$RUNNER_TEMP/sorrelgate-m1-degraded.txt"
      - name: Generate native Xcode project
        run: xcodegen generate --spec project.yml
      - name: Test customer-bundle reference scanner
        run: python3 scripts/test_verify_customer_bundle.py
      - name: Build release-configuration Mac app (unsigned, CI only)
        run: |
          xcodebuild \
            -project Sorrelgate.xcodeproj \
            -scheme Sorrelgate \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            'ARCHS=arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            'LD_RUNPATH_SEARCH_PATHS=@executable_path/../Frameworks @loader_path/../Frameworks' \
            build
      - name: Verify minimum Ventura deployment and universal executable
        run: |
          app=".build/DerivedData/Build/Products/Release/Sorrelgate.app"
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist" | grep -Fx '13.0'
          lipo "$app/Contents/MacOS/Sorrelgate" -verify_arch arm64 x86_64
          for arch in arm64 x86_64; do
            vtool -show-build -arch "$arch" "$app/Contents/MacOS/Sorrelgate"
            vtool -show-build -arch "$arch" "$app/Contents/MacOS/Sorrelgate" | grep -Eq 'minos 13\\.0'
          done
          echo "VENTURA_13_UNIVERSAL_METADATA_PASS"
      - name: Assemble and audit source-free tester bundle
        run: |
          bash scripts/package_beta_handoff.sh \
            .build/DerivedData/Build/Products/Release/Sorrelgate.app
      - name: Upload one standalone source-free tester ZIP (UNSIGNED)
        uses: actions/upload-artifact@v4
        with:
          name: Sorrelgate-0.1.2-Ventura-Standalone-Mac-Test
          path: dist/Sorrelgate-0.1.2-Ventura-Standalone-Mac-Test.zip
          if-no-files-found: error
          retention-days: 14
