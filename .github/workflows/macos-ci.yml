name: macOS Build and Core Tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Swift tests and native app build
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Install developer-only Xcode project generator
        run: brew install xcodegen
      - name: Build and run SorrelgateCore tests
        run: swift test --parallel
      - name: Record actual Vision OCR and mixed-PDF benchmark measurements
        run: |
          test -s "$RUNNER_TEMP/sorrelgate-m1-ocr.txt"
          test -s "$RUNNER_TEMP/sorrelgate-m1-batch.txt"
          cat "$RUNNER_TEMP/sorrelgate-m1-ocr.txt"
          cat "$RUNNER_TEMP/sorrelgate-m1-batch.txt"
          test -s "$RUNNER_TEMP/sorrelgate-m1-degraded.txt"
          cat "$RUNNER_TEMP/sorrelgate-m1-degraded.txt"
      - name: Generate native Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build Mac app (unsigned, CI only)
        run: |
          xcodebuild \
            -project Sorrelgate.xcodeproj \
            -scheme Sorrelgate \
            -configuration Debug \
            -destination "generic/platform=macOS" \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Assemble Beta 0.1.0 handoff and verify PDFKit fixtures
        run: |
          bash scripts/package_beta_handoff.sh \
            .build/DerivedData/Build/Products/Debug/Sorrelgate.app
      - name: Upload one Beta 0.1.0 assisted tester bundle (UNSIGNED)
        uses: actions/upload-artifact@v4
        with:
          name: Sorrelgate-Beta-0.1.0-UNSIGNED-macOS
          path: dist/Sorrelgate-Beta-0.1.0-macOS-UNSIGNED.zip
          if-no-files-found: error
          retention-days: 14
